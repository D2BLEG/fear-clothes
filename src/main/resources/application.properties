spring.application.name=fear-clothes
server.port=8080

# --- Base de datos local: H2 guardada en archivo (carpeta ./data). Los datos persisten entre arranques. ---
# Para reiniciar con datos de prueba nuevos: apaga la app y borra la carpeta "data".
spring.datasource.url=jdbc:h2:file:./data/fearclothes
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Consola H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/fearclothes)
spring.h2.console.enabled=true

spring.thymeleaf.cache=false

# --- Imágenes subidas por los vendedores ---
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
