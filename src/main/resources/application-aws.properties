# Perfil "aws": java -jar fear-clothes.jar --spring.profiles.active=aws
# Las credenciales llegan por variables de entorno (nunca se suben al repositorio).
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:fearclothes}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
server.port=${PORT:8080}
