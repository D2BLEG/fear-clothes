<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 my-3">
        <h1 class="h3 mb-0">Usuarios</h1>
        <a th:href="@{/admin}" class="btn btn-outline-light">← Panel de administración</a>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle">
            <thead>
            <tr><th>#</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.nombre}">Nombre</td>
                <td th:text="${u.email}">correo</td>
                <td><span class="badge text-bg-secondary" th:text="${u.rol}">ROL</span></td>
                <td><span class="badge" th:classappend="${u.activo} ? 'text-bg-success' : 'text-bg-danger'"
                          th:text="${u.activo} ? 'Activo' : 'Desactivado'">Estado</span></td>
                <td class="text-end">
                    <form th:if="${u.rol != 'ADMIN'}"
                          th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}" method="post">
                        <button type="submit" class="btn btn-sm"
                                th:classappend="${u.activo} ? 'btn-outline-danger' : 'btn-outline-success'"
                                th:text="${u.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
