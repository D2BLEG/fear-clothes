<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5 col-xl-4">
            <div class="card bg-body-tertiary">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Crear cuenta</h1>

                    <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="rol" class="form-label">Quiero</label>
                            <select th:field="*{rol}" class="form-select">
                                <option value="COMPRADOR">Comprar</option>
                                <option value="VENDEDOR">Comprar y vender</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Crear cuenta</button>
                    </form>

                    <p class="text-secondary small mt-3 mb-0">
                        ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
