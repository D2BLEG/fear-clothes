<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar talla')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div th:replace="~{fragments/layout :: mensajes}"></div>

            <div class="card bg-body-tertiary mt-3">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">Editar talla</h1>
                    <form th:action="@{/admin/tallas/{id}/editar(id=${talla.id})}" method="post">
                        <div class="mb-3">
                            <label for="etiqueta" class="form-label">Talla</label>
                            <input type="text" id="etiqueta" name="etiqueta" class="form-control"
                                   th:value="${talla.etiqueta}" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger flex-grow-1">Guardar cambios</button>
                            <a th:href="@{/admin}" class="btn btn-outline-light">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
